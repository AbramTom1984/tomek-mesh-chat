plugins { id 'com.android.application' }
android {
    namespace 'com.tomaszabramowicz.meshchat'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tomaszabramowicz.meshchat'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0-passive-signal'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'com.github.mik3y:usb-serial-for-android:3.9.0' }
