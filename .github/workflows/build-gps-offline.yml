name: Build Android APK - GPS Offline 0.3.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply GPS and offline-map integration
        run: python3 tools/apply_03.py
      - name: Run location protocol self-test
        run: |
          mkdir -p "$RUNNER_TEMP/location-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/location-tests" \
            app/src/main/java/com/tomaszabramowicz/meshchat/LocationCodec.java \
            tests/LocationCodecSelfTest.java
          java -cp "$RUNNER_TEMP/location-tests" LocationCodecSelfTest
      - name: Read project Gradle version
        id: gradle_version
        run: |
          FILE="gradle/wrapper/gradle-wrapper.properties"
          VERSION="$(sed -nE 's/.*gradle-([0-9]+(\.[0-9]+)+)-(bin|all)\.zip.*/\1/p' "$FILE" | head -n1)"
          test -n "$VERSION" || { echo "::error::Gradle version not found"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_version.outputs.version }}
      - name: Include library license texts
        run: |
          DIR=app/src/main/assets/licenses
          mkdir -p "$DIR"
          curl --fail --location --retry 3 https://www.gnu.org/licenses/lgpl-3.0.txt -o "$DIR/LGPL-3.0.txt"
          curl --fail --location --retry 3 https://www.gnu.org/licenses/gpl-3.0.txt -o "$DIR/GPL-3.0.txt"
          curl --fail --location --retry 3 https://www.apache.org/licenses/LICENSE-2.0.txt -o "$DIR/Apache-2.0.txt"
      - name: Build test APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tomek-Mesh-Chat-0.3.0-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload source snapshot used for this build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tomek-Mesh-Chat-0.3.0-build-sources
          path: |
            app/src/
            app/build.gradle
            build.gradle
            settings.gradle
            gradle.properties
            gradle/
            tools/
            tests/
            THIRD_PARTY_LOCATION_03.md
            LICENSE
          if-no-files-found: warn
