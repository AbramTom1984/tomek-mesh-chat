name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Read project Gradle version
        id: gradle_version
        shell: bash
        run: |
          FILE="gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$FILE" ]; then
            echo "::error::Missing $FILE"
            exit 1
          fi

          VERSION="$(sed -nE \
            's/.*gradle-([0-9]+(\.[0-9]+)+)-(bin|all)\.zip.*/\1/p' \
            "$FILE" | head -n 1)"

          if [ -z "$VERSION" ]; then
            echo "::error::Cannot read Gradle version from $FILE"
            cat "$FILE"
            exit 1
          fi

          echo "Using Gradle $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_version.outputs.version }}

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tomek-Mesh-Chat-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
